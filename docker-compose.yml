services:
  postgres:
    image: postgres:18-alpine
    container_name: anantaone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ananta
      POSTGRES_PASSWORD: ananta123
      POSTGRES_DB: anantaone
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: anantaone-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
