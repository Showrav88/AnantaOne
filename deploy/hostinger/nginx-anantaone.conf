# AnantaOne — nginx site (Hostinger VPS)
# Copy to: /etc/nginx/sites-available/anantaone
# Enable:  ln -sf /etc/nginx/sites-available/anantaone /etc/nginx/sites-enabled/
# Test:     nginx -t && systemctl reload nginx
#
# Replace YOUR_DOMAIN with your real domain, e.g. ananta.example.com

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # After certbot: certbot --nginx -d YOUR_DOMAIN
    # listen 443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    root /var/www/anantaone/apps/web/dist;
    index index.html;

    client_max_body_size 25m;

    # API (Express on port 5000)
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:5000/health;
        proxy_set_header Host $host;
    }

    location = /health/db {
        proxy_pass http://127.0.0.1:5000/health/db;
        proxy_set_header Host $host;
    }

    # SPA — React hash routes and deep links
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/anantaone.access.log;
    error_log /var/log/nginx/anantaone.error.log;
}
