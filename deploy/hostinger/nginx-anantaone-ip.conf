# AnantaOne — nginx for VPS IP only (no domain yet)
# Copy to: /etc/nginx/sites-available/anantaone
# Enable:  ln -sf /etc/nginx/sites-available/anantaone /etc/nginx/sites-enabled/
# Test:     nginx -t && systemctl reload nginx
#
# Replace YOUR_VPS_IP with your Hostinger IP, e.g. 31.97.50.25
# HTTP only — Let's Encrypt needs a domain. Add SSL when you connect a domain.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_VPS_IP;

    root /var/www/anantaone/apps/web/dist;
    index index.html;

    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:5000/health;
        proxy_set_header Host $host;
    }

    location = /health/db {
        proxy_pass http://127.0.0.1:5000/health/db;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/anantaone.access.log;
    error_log /var/log/nginx/anantaone.error.log;
}

# If another app already owns port 80 for all IPs, use a high port instead:
#
# server {
#     listen 8080;
#     listen [::]:8080;
#     server_name YOUR_VPS_IP;
#     ... same locations ...
# }
# Then open: http://YOUR_VPS_IP:8080/#/login
# And set APP_URL=http://YOUR_VPS_IP:8080 in .env
